name: Update Widgetbook Wiki on PR merges to main

on:
  pull_request:
    branches: ["main"]
    types: [closed]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: "update-wiki"
  cancel-in-progress: true

jobs:
  update_wiki:
    if: ${{ github.event.pull_request.merged == true }}
    runs-on: ubuntu-latest

    steps:
      - name: Resolve PR context
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            core.setOutput('body', pr.body || '');
            core.setOutput('title', pr.title || '');
            core.setOutput('number', String(pr.number));
            core.setOutput('url', pr.html_url || '');

      - name: Checkout Wiki repo
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}.wiki
          token: ${{ secrets.WIKI_TOKEN || github.token }}
          path: wiki

      - name: Update Widgetbook Wiki (index + component pages + sidebar)
        env:
          PR_BODY: ${{ steps.pr.outputs.body }}
          PR_TITLE: ${{ steps.pr.outputs.title }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          PR_URL: ${{ steps.pr.outputs.url }}
          REPO_NAME: ${{ github.event.repository.name }}
          OWNER: ${{ github.repository_owner }}

          PAGE_INDEX: wiki/Widgetbook.md
          COMP_DIR: wiki/Widgetbook
          SIDEBAR: wiki/_Sidebar.md
        run: |
          set -e

          export WIDGETBOOK_URL="https://${OWNER}.github.io/${REPO_NAME}/"
          export TODAY="$(date -u +%Y-%m-%d)"

          python3 - <<'PY'
          import os, re
          from pathlib import Path

          index_page = Path(os.environ["PAGE_INDEX"])
          comp_dir = Path(os.environ["COMP_DIR"])
          sidebar_page = Path(os.environ["SIDEBAR"])

          widgetbook_url = os.environ["WIDGETBOOK_URL"]
          today = os.environ["TODAY"]

          body = os.environ.get("PR_BODY", "") or ""
          pr_title = os.environ.get("PR_TITLE", "") or ""
          pr_number = os.environ.get("PR_NUMBER", "") or ""
          pr_url = os.environ.get("PR_URL", "") or ""

          def safe_slug(s: str) -> str:
            s = (s or "").strip()
            if not s:
              return "UNKNOWN"
            s = re.sub(r"\s+", "-", s)
            s = re.sub(r"[^A-Za-z0-9._\-]", "-", s)
            s = re.sub(r"-{2,}", "-", s).strip("-")
            return s or "UNKNOWN"

          def extract_section(pr_body: str, heading: str) -> str:
            # Captures content after "## <heading>" until next "##" or end
            m = re.search(rf"##\s*{re.escape(heading)}\s*\n([\s\S]*?)(\n##|\Z)", pr_body)
            return (m.group(1).strip("\n") if m else "").strip()

          def ensure_index(text: str) -> str:
            # Only keep: title + live + Components
            if text.strip():
              return text
            return (
              "# Widgetbook\n\n"
              f"**Live:** {widgetbook_url}\n\n"
              "## Components\n"
            )

          def ensure_live_link(text: str) -> str:
            lines = text.splitlines()
            live_line = f"**Live:** {widgetbook_url}"
            for i, ln in enumerate(lines):
              if ln.startswith("**Live:**"):
                lines[i] = live_line
                return "\n".join(lines).rstrip() + "\n"
            if lines and lines[0].startswith("# "):
              lines.insert(1, "")
              lines.insert(2, live_line)
              lines.insert(3, "")
            else:
              lines.insert(0, live_line)
              lines.insert(1, "")
            return "\n".join(lines).rstrip() + "\n"

          def split_lines_keepends(text: str):
            return text.splitlines(True) if text else []

          def find_section(lines, header):
            idx = None
            for i, ln in enumerate(lines):
              if ln.strip() == f"## {header}":
                idx = i
                break
            if idx is None:
              if lines and not lines[-1].endswith("\n"):
                lines[-1] += "\n"
              lines.append(f"\n## {header}\n")
              idx = len(lines) - 1

            start = idx + 1
            end = len(lines)
            for j in range(start, len(lines)):
              if lines[j].startswith("## "):
                end = j
                break
            return idx, start, end

          def upsert_component_in_index(index_lines, cid, entry_line):
            _, start, end = find_section(index_lines, "Components")
            marker = f"`{cid}`"
            for i in range(start, end):
              if marker in index_lines[i]:
                index_lines[i] = entry_line + "\n"
                return
            index_lines.insert(start, entry_line + "\n")

          def parse_components(pr_body: str):
            # Determine change type (new/edit) but index page won't show it anymore.
            is_new = bool(re.search(r"-\s*\[[xX]\]\s*New component", pr_body))
            is_edit = bool(re.search(r"-\s*\[[xX]\]\s*Edit existing component", pr_body))
            change_type = "new" if is_new else ("edit" if is_edit else "edit")

            m = re.search(r"##\s*Component\(s\)([\s\S]*?)(\n##|\Z)", pr_body)
            section = m.group(1) if m else ""

            block_re = re.compile(
              r"-\s*id:\s*\"?([^\n\"]+)\"?\s*\n"
              r"\s*name:\s*\"?([^\n\"]+)\"?\s*\n"
              r"\s*widgetbook_path:\s*\"?([^\n\"]*)\"?\s*\n"
              r"\s*change_summary:\s*\"?([^\n\"]*)\"?\s*(?:\n|$)",
              re.MULTILINE
            )

            comps = []
            for mm in block_re.finditer(section):
              comps.append({
                "id": (mm.group(1) or "").strip(),
                "name": (mm.group(2) or "").strip(),
                "path": (mm.group(3) or "").strip(),
                "summary": (mm.group(4) or "").strip(),
              })

            return change_type, comps

          def ensure_sidebar(text: str) -> str:
            if text.strip():
              return text
            return (
              "* [Home](Home)\n"
              "* [Widgetbook](Widgetbook)\n"
            )

          def upsert_sidebar(lines, page_link: str, display_name: str, group_header="* [Widgetbook](Widgetbook)"):
            if not any(ln.strip() == group_header for ln in lines):
              if lines and not lines[-1].endswith("\n"):
                lines[-1] += "\n"
              if lines and lines[-1].strip() != "":
                lines.append("\n")
              lines.append(group_header + "\n")

            gidx = next(i for i, ln in enumerate(lines) if ln.strip() == group_header)
            start = gidx + 1
            end = len(lines)
            for j in range(start, len(lines)):
              if lines[j].startswith("* ") and not lines[j].startswith("  * "):
                end = j
                break

            entry = f"  * [{display_name}]({page_link})"
            for i in range(start, end):
              if f"]({page_link})" in lines[i]:
                lines[i] = entry + "\n"
                return
            lines.insert(start, entry + "\n")

          def get_section_content(text: str, header: str) -> str:
            m = re.search(rf"##\s*{re.escape(header)}\s*\n([\s\S]*?)(\n##|\Z)", text)
            return (m.group(1).strip("\n") if m else "").strip()

          def render_component_page(title: str, cid: str, wb_path: str, params_md: str, shots_md: str, version_lines: list[str]) -> str:
            out = []
            out.append(f"# {title}\n\n")
            out.append(f"**ID:** `{cid}`\n\n")
            if wb_path:
              out.append(f"**Widgetbook path:** `{wb_path}`\n\n")
            out.append(f"**Live:** {widgetbook_url}\n\n")

            out.append("## Parameters Used\n")
            out.append((params_md.strip() + "\n") if params_md.strip() else "_N/A_\n")
            out.append("\n")

            out.append("## Screenshots\n")
            out.append((shots_md.strip() + "\n") if shots_md.strip() else "_N/A_\n")
            out.append("\n")

            # Only create Version log section if there is any entry
            if version_lines:
              out.append("## Version log\n")
              for ln in version_lines:
                out.append(ln.rstrip() + "\n")
              out.append("\n")

            return "".join(out).rstrip() + "\n"

          def upsert_version_log(existing_text: str, summary: str, pr_number: str, pr_url: str):
            # Read old version log lines
            old = get_section_content(existing_text, "Version log")
            old_lines = [ln for ln in old.splitlines() if ln.strip().startswith("- ")] if old else []

            # Build new entry for this PR
            parts = [f"- {today}"]
            if summary:
              parts.append(f"— {summary}")
            if pr_number and pr_url:
              parts.append(f"— [PR #{pr_number}]({pr_url})")
            new_entry = " ".join(parts)

            # Replace if same PR exists
            pr_marker = f"[PR #{pr_number}]" if pr_number else None
            if pr_marker:
              filtered = [ln for ln in old_lines if pr_marker not in ln]
            else:
              filtered = old_lines[:]

            # Insert new at top
            return [new_entry] + filtered

          # ---- Load/create index ----
          try:
            index_text = index_page.read_text(encoding="utf-8")
          except FileNotFoundError:
            index_text = ""
          index_text = ensure_index(index_text)
          index_text = ensure_live_link(index_text)
          index_lines = split_lines_keepends(index_text)
          find_section(index_lines, "Components")

          # ---- Load/create sidebar ----
          try:
            sidebar_text = sidebar_page.read_text(encoding="utf-8")
          except FileNotFoundError:
            sidebar_text = ""
          sidebar_text = ensure_sidebar(sidebar_text)
          sidebar_lines = split_lines_keepends(sidebar_text)

          # ---- Parse PR ----
          _, comps = parse_components(body)
          params_from_pr = extract_section(body, "Parameters Used")
          shots_from_pr = extract_section(body, "Screenshots")

          if not comps:
            comps = [{
              "id": "UNKNOWN",
              "name": pr_title or "Update",
              "path": "",
              "summary": "",
            }]

          for c in comps:
            raw_cid = c["id"] or "UNKNOWN"
            cid = safe_slug(raw_cid)
            name = c["name"] or raw_cid or cid
            wb_path = c["path"] or ""
            summary = c["summary"] or ""

            comp_page = comp_dir / f"{cid}.md"
            comp_dir.mkdir(parents=True, exist_ok=True)

            existing_text = comp_page.read_text(encoding="utf-8") if comp_page.exists() else ""

            # If PR didn't provide params/screenshots, keep existing section content (if any)
            params_md = params_from_pr if params_from_pr else get_section_content(existing_text, "Parameters Used")
            shots_md = shots_from_pr if shots_from_pr else get_section_content(existing_text, "Screenshots")

            # Version log only when component is in PR (new/edit). This is already true.
            version_lines = upsert_version_log(existing_text, summary, pr_number, pr_url)

            new_text = render_component_page(
              title=name,
              cid=cid,
              wb_path=wb_path,
              params_md=params_md,
              shots_md=shots_md,
              version_lines=version_lines,
            )
            comp_page.write_text(new_text, encoding="utf-8")

            # Update index Components list
            wiki_link = f"Widgetbook/{cid}"
            comp_entry = f"- [{name}]({wiki_link}) (`{cid}`)" + (f" — Path: `{wb_path}`" if wb_path else "")
            upsert_component_in_index(index_lines, cid, comp_entry)

            # Update sidebar
            upsert_sidebar(sidebar_lines, wiki_link, name)

          # ---- Write back ----
          index_page.parent.mkdir(parents=True, exist_ok=True)
          index_page.write_text("".join(index_lines).rstrip() + "\n", encoding="utf-8")

          sidebar_page.parent.mkdir(parents=True, exist_ok=True)
          sidebar_page.write_text("".join(sidebar_lines).rstrip() + "\n", encoding="utf-8")
          PY

      - name: Commit & push Wiki changes
        run: |
          cd wiki
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Update Widgetbook wiki"
          git push