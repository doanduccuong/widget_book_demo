name: Update Wiki on PR merges to main

on:
  pull_request:
    branches: ["main"]
    types: [closed]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: "update-wiki"
  cancel-in-progress: true

jobs:
  update_wiki:
    if: ${{ github.event.pull_request.merged == true }}
    runs-on: ubuntu-latest

    steps:
      - name: Resolve PR context
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            core.setOutput('body', pr.body || '');
            core.setOutput('title', pr.title || '');
            core.setOutput('number', String(pr.number));
            core.setOutput('url', pr.html_url || '');

      - name: Checkout Wiki repo
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}.wiki
          token: ${{ secrets.WIKI_TOKEN || github.token }}
          path: wiki

      - name: Update Wiki (index + component pages)
        env:
          PR_BODY: ${{ steps.pr.outputs.body }}
          PR_TITLE: ${{ steps.pr.outputs.title }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          PR_URL: ${{ steps.pr.outputs.url }}
          PAGE_INDEX: wiki/Widgetbook.md
        run: |
          set -e
          export TODAY="$(date -u +%Y-%m-%d)"

          python3 - <<'PY'
          import os, re
          from pathlib import Path

          index_page = Path(os.environ["PAGE_INDEX"])
          wiki_root = index_page.parent

          today = os.environ["TODAY"]

          body = os.environ.get("PR_BODY", "") or ""
          pr_title = os.environ.get("PR_TITLE", "") or ""
          pr_number = os.environ.get("PR_NUMBER", "") or ""
          pr_url = os.environ.get("PR_URL", "") or ""

          def safe_slug(s: str) -> str:
            s = (s or "").strip()
            if not s:
              return "UNKNOWN"
            s = re.sub(r"\s+", "-", s)
            s = re.sub(r"[^A-Za-z0-9._\-]", "-", s)
            s = re.sub(r"-{2,}", "-", s).strip("-")
            return s or "UNKNOWN"

          def extract_section(pr_body: str, heading: str) -> str:
            m = re.search(rf"##\s*{re.escape(heading)}\s*\n([\s\S]*?)(\n##|\Z)", pr_body)
            return (m.group(1).strip("\n") if m else "").strip()

          def ensure_index(text: str) -> str:
            if text.strip():
              return text
            return (
              "# Widgetbook\n\n"
              "## Components\n"
            )

          def split_lines_keepends(text: str):
            return text.splitlines(True) if text else []

          def find_section(lines, header):
            idx = None
            for i, ln in enumerate(lines):
              if ln.strip() == f"## {header}":
                idx = i
                break
            if idx is None:
              if lines and not lines[-1].endswith("\n"):
                lines[-1] += "\n"
              lines.append(f"\n## {header}\n")
              idx = len(lines) - 1

            start = idx + 1
            end = len(lines)
            for j in range(start, len(lines)):
              if lines[j].startswith("## "):
                end = j
                break
            return idx, start, end

          def upsert_component_in_index(index_lines, cid, entry_line):
            _, start, end = find_section(index_lines, "Components")
            marker = f"`{cid}`"
            for i in range(start, end):
              if marker in index_lines[i]:
                index_lines[i] = entry_line + "\n"
                return
            index_lines.insert(start, entry_line + "\n")

          def parse_components(pr_body: str):
            m = re.search(r"##\s*Component\(s\)([\s\S]*?)(\n##|\Z)", pr_body)
            section = m.group(1) if m else ""

            block_re = re.compile(
              r"-\s*id:\s*\"?([^\n\"]+)\"?\s*\n"
              r"\s*name:\s*\"?([^\n\"]+)\"?\s*\n"
              r"\s*widgetbook_path:\s*\"?([^\n\"]*)\"?\s*\n"
              r"\s*change_summary:\s*\"?([^\n\"]*)\"?\s*(?:\n|$)",
              re.MULTILINE
            )

            comps = []
            for mm in block_re.finditer(section):
              comps.append({
                "id": (mm.group(1) or "").strip(),
                "name": (mm.group(2) or "").strip(),
                "path": (mm.group(3) or "").strip(),
                "summary": (mm.group(4) or "").strip(),
              })

            return comps

          def get_section_content(text: str, header: str) -> str:
            m = re.search(rf"##\s*{re.escape(header)}\s*\n([\s\S]*?)(\n##|\Z)", text)
            return (m.group(1).strip("\n") if m else "").strip()

          def upsert_version_log(existing_text: str, summary: str, pr_number: str, pr_url: str):
            old = get_section_content(existing_text, "Version log")
            old_lines = [ln for ln in old.splitlines() if ln.strip().startswith("- ")] if old else []

            parts = [f"- {today}"]
            if summary:
              parts.append(f"— {summary}")
            if pr_number and pr_url:
              parts.append(f"— [PR #{pr_number}]({pr_url})")
            new_entry = " ".join(parts)

            pr_marker = f"[PR #{pr_number}]" if pr_number else None
            if pr_marker:
              old_lines = [ln for ln in old_lines if pr_marker not in ln]

            return [new_entry] + old_lines

          def render_component_page(title: str, cid: str, wb_path: str, params_md: str, shots_md: str, version_lines: list[str]) -> str:
            out = []
            out.append(f"# {title}\n\n")
            out.append(f"**ID:** `{cid}`\n\n")
            if wb_path:
              out.append(f"**Widgetbook path:** `{wb_path}`\n\n")

            out.append("## Parameters Used\n")
            out.append((params_md.strip() + "\n") if params_md.strip() else "_N/A_\n")
            out.append("\n")

            out.append("## Screenshots\n")
            out.append((shots_md.strip() + "\n") if shots_md.strip() else "_N/A_\n")
            out.append("\n")

            if version_lines:
              out.append("## Version log\n")
              for ln in version_lines:
                out.append(ln.rstrip() + "\n")
              out.append("\n")

            return "".join(out).rstrip() + "\n"

          # ---- Load/create index ----
          try:
            index_text = index_page.read_text(encoding="utf-8")
          except FileNotFoundError:
            index_text = ""
          index_text = ensure_index(index_text)
          index_lines = split_lines_keepends(index_text)
          find_section(index_lines, "Components")

          # ---- Parse PR ----
          comps = parse_components(body)
          params_from_pr = extract_section(body, "Parameters Used")
          shots_from_pr = extract_section(body, "Screenshots")

          if not comps:
            comps = [{
              "id": "UNKNOWN",
              "name": pr_title or "Update",
              "path": "",
              "summary": "",
            }]

          for c in comps:
            raw_id = c["id"] or "UNKNOWN"
            cid = safe_slug(raw_id)              # page name
            name = c["name"] or raw_id or cid
            wb_path = c["path"] or ""
            summary = c["summary"] or ""

            page_path = wiki_root / f"{cid}.md"  # top-level page
            existing_text = page_path.read_text(encoding="utf-8") if page_path.exists() else ""

            params_md = params_from_pr if params_from_pr else get_section_content(existing_text, "Parameters Used")
            shots_md = shots_from_pr if shots_from_pr else get_section_content(existing_text, "Screenshots")

            version_lines = upsert_version_log(existing_text, summary, pr_number, pr_url)

            new_text = render_component_page(
              title=name,
              cid=cid,
              wb_path=wb_path,
              params_md=params_md,
              shots_md=shots_md,
              version_lines=version_lines,
            )
            page_path.write_text(new_text, encoding="utf-8")

            comp_entry = f"- [{name}]({cid}) (`{cid}`)" + (f" — Path: `{wb_path}`" if wb_path else "")
            upsert_component_in_index(index_lines, cid, comp_entry)

          # ---- Write back index ----
          index_page.parent.mkdir(parents=True, exist_ok=True)
          index_page.write_text("".join(index_lines).rstrip() + "\n", encoding="utf-8")
          PY

      - name: Commit & push Wiki changes
        run: |
          cd wiki
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Update Widgetbook wiki"
          git push